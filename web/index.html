<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Check school buildings against the Ministry of Education and Sports School Accessibility Companion Guide, see what is missing and track fixes.">
  <meta name="theme-color" content="#142D52">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AccessPath">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AccessPath Schools</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    #splash img { width: min(240px, 60vw); height: auto; }
    #splash.hidden { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Shown while the app downloads, then faded out on Flutter's first frame. -->
  <div id="splash" role="status">
    <img src="splash-logo.svg" alt="AccessPath is loading">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
